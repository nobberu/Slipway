[package]
name = "Slipway"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = [
  "std",
  "compat-1-18",
  "backend-default",
  "renderer-software",
  "raw-window-handle-06",
] }
window-vibrancy = "0.8.1"
raw-window-handle = "0.6"

[build-dependencies]
slint-build = { version = "1.18.1", default-features = false, features = [
  "compat-1-18",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
