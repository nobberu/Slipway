[package]
name = "Slipway"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = [
  "std",
  "compat-1-18",
  "backend-winit",
  "renderer-femtovg",
  "raw-window-handle-06",
] }
window-vibrancy = "0.8.1"
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[build-dependencies]
slint-build = { version = "1.18.1", default-features = false, features = [
  "compat-1-18",
] }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
